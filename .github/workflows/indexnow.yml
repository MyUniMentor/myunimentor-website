name: Tell Bing and other search engines about changed pages

on:
  push:
    branches: [main]
    paths: ['*.html', 'sitemap.xml']

permissions:
  contents: read

jobs:
  ping:
    if: github.repository == 'MyUniMentor/myunimentor-website'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Wait for GitHub Pages to publish
        run: sleep 90
      - name: Send changed URLs to IndexNow (Bing, Yandex, Seznam, Naver; Bing feeds ChatGPT and Copilot search)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          before = os.environ.get('BEFORE', '')
          if not before or set(before) == {'0'}: before = 'HEAD~1'
          try: files = subprocess.run(['git', 'diff', '--name-only', before, 'HEAD'], capture_output=True, text=True, check=True).stdout.split()
          except Exception: files = []
          skip = {'404.html', 'account.html', 'admin.html'}
          urls = []
          for f in files:
              if f.endswith('.html') and '/' not in f and f not in skip and os.path.exists(f):
                  if 'noindex' in open(f, encoding='utf-8').read()[:3000]: continue
                  urls.append('https://myunimentor.in/' + ('' if f == 'index.html' else f[:-5]))
          if not urls: print('No public pages changed.'); raise SystemExit
          body = {'host': 'myunimentor.in', 'key': 'd1f3798fad575429f9d496aac49c1302', 'keyLocation': 'https://myunimentor.in/d1f3798fad575429f9d496aac49c1302.txt', 'urlList': urls[:10000]}
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=json.dumps(body).encode(), headers={'Content-Type': 'application/json; charset=utf-8'}, method='POST')
          try: print('IndexNow', urllib.request.urlopen(req, timeout=30).status, len(urls), 'URLs')
          except Exception as e: print('IndexNow refused:', e)
          PY
