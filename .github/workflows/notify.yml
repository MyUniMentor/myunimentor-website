name: Emails to students and parents

on:
  push:
    branches: [main]
    paths: ['data/exams.json', 'content_blog.py']
  schedule:
    - cron: '17 * * * *'          # every hour: queued mail and approved announcements; daily jobs after 8 am IST
  workflow_dispatch:
    inputs:
      mode:
        description: 'changes or scheduled'
        default: 'scheduled'
      test_to:
        description: 'Send every email only to this address (leave empty for real sending)'
        default: ''

concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    if: github.repository == 'MyUniMentor/myunimentor-website'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet firebase-admin
      - name: Send
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          BREVO_KEY: ${{ secrets.BREVO_KEY }}
          BEFORE: ${{ github.event.before }}
          TEST_TO: ${{ github.event.inputs.test_to }}
        run: |
          if [ -z "$FIREBASE_SA" ] || [ -z "$BREVO_KEY" ]; then echo "Secrets not set yet, skipping."; exit 0; fi
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE=changes; fi
          python3 tools/notify.py "${MODE:-scheduled}"
